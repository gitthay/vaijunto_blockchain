services:
  empresaA:
    build: .
    image: vaijunto-servidor:latest
    container_name: vaijunto_empresa_a
    environment:
      - VJ_EMISSORES=${VJ_EMISSORES:-}
    command:
      - "-id=empresaA"
      - "-tcp=:8081"
      - "-http=:9081"
      - "-url=http://${IP_A:-empresaA}:9081"
      - "-peers=http://${IP_B:-empresaB}:9082,http://${IP_C:-empresaC}:9083,http://${IP_D:-empresaD}:9084"
    ports:
      - "8081:8081"
      - "9081:9081"
    volumes:
      - ./dados/empresaA:/app/dados/empresaA

  empresaB:
    build: .
    image: vaijunto-servidor:latest
    container_name: vaijunto_empresa_b
    environment:
      - VJ_EMISSORES=${VJ_EMISSORES:-}
    command:
      - "-id=empresaB"
      - "-tcp=:8082"
      - "-http=:9082"
      - "-url=http://${IP_B:-empresaB}:9082"
      - "-peers=http://${IP_A:-empresaA}:9081,http://${IP_C:-empresaC}:9083,http://${IP_D:-empresaD}:9084"
    ports:
      - "8082:8082"
      - "9082:9082"
    volumes:
      - ./dados/empresaB:/app/dados/empresaB

  empresaC:
    build: .
    image: vaijunto-servidor:latest
    container_name: vaijunto_empresa_c
    environment:
      - VJ_EMISSORES=${VJ_EMISSORES:-}
    command:
      - "-id=empresaC"
      - "-tcp=:8083"
      - "-http=:9083"
      - "-url=http://${IP_C:-empresaC}:9083"
      - "-peers=http://${IP_A:-empresaA}:9081,http://${IP_B:-empresaB}:9082,http://${IP_D:-empresaD}:9084"
    ports:
      - "8083:8083"
      - "9083:9083"
    volumes:
      - ./dados/empresaC:/app/dados/empresaC

  empresaD:
    build: .
    image: vaijunto-servidor:latest
    container_name: vaijunto_empresa_d
    environment:
      - VJ_EMISSORES=${VJ_EMISSORES:-}
    command:
      - "-id=empresaD"
      - "-tcp=:8084"
      - "-http=:9084"
      - "-url=http://${IP_D:-empresaD}:9084"
      - "-peers=http://${IP_A:-empresaA}:9081,http://${IP_B:-empresaB}:9082,http://${IP_C:-empresaC}:9083"
    ports:
      - "8084:8084"
      - "9084:9084"
    volumes:
      - ./dados/empresaD:/app/dados/empresaD
